# ============================================================================
# compose/gpu.windows.yml
# ----------------------------------------------------------------------------
# Overlay de GPU para Docker Desktop no Windows (backend WSL2).
#
# No Docker Desktop, `device_ids` não é confiável para fixar um container a
# uma GPU específica. Por isso, os dois containers recebem TODAS as GPUs
# (count: all) e o isolamento é feito um nível abaixo, pelo próprio CUDA:
# CUDA_VISIBLE_DEVICES limita quais placas o processo Ollama enxerga.
# CUDA_DEVICE_ORDER=PCI_BUS_ID faz o índice bater com o de `nvidia-smi -L`.
#
# Confirme o resultado com scripts/check-gpu-affinity.ps1.
# Detalhes: docs/windows-gpu-notes.md. Usado quando HOST_OS=windows.
# ============================================================================

services:
  ollama-gpu0:
    environment:
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - CUDA_VISIBLE_DEVICES=${GPU0_DEVICE_INDEX:-0}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama-gpu1:
    environment:
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - CUDA_VISIBLE_DEVICES=${GPU1_DEVICE_INDEX:-1}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
