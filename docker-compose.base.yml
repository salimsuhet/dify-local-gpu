# ============================================================================
# docker-compose.base.yml
# ----------------------------------------------------------------------------
# Define os serviços ollama-gpu0, ollama-gpu1 e qdrant SEM a configuração de
# GPU (que muda entre Linux e Windows). A configuração de GPU é adicionada
# por um overlay específico:
#   - compose/gpu.linux.yml    (1 GPU dedicada por container, isolamento real)
#   - compose/gpu.windows.yml  (todas as GPUs visíveis em ambos containers —
#                                 limitação do Docker Desktop, ver
#                                 docs/windows-gpu-notes.md)
#
# Não rode este arquivo isolado — use scripts/up.sh (Linux/macOS) ou
# scripts/up.ps1 (Windows), que combinam este arquivo com o overlay correto
# automaticamente, conforme o HOST_OS definido no .env.
# ============================================================================

networks:
  dify-local-gpu-net:
    name: ${SHARED_NETWORK_NAME:-dify-local-gpu-net}
    driver: bridge

volumes:
  ollama-gpu0-data:
  ollama-gpu1-data:
  qdrant-data:

services:

  # --------------------------------------------------------------------
  # Ollama "GPU0" — serve o modelo de CHAT
  # --------------------------------------------------------------------
  ollama-gpu0:
    image: ollama/ollama:latest
    container_name: ollama-gpu0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_GPU0_PORT:-11434}:11434"
    environment:
      - OLLAMA_NUM_PARALLEL=${OLLAMA_GPU0_NUM_PARALLEL:-1}
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=30m
    volumes:
      - ollama-gpu0-data:/root/.ollama
    networks:
      - dify-local-gpu-net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3

  # --------------------------------------------------------------------
  # Ollama "GPU1" — serve EMBEDDING + RERANK
  # --------------------------------------------------------------------
  ollama-gpu1:
    image: ollama/ollama:latest
    container_name: ollama-gpu1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_GPU1_PORT:-11435}:11434"
    environment:
      - OLLAMA_NUM_PARALLEL=${OLLAMA_GPU1_NUM_PARALLEL:-2}
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_KEEP_ALIVE=30m
    volumes:
      - ollama-gpu1-data:/root/.ollama
    networks:
      - dify-local-gpu-net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3

  # --------------------------------------------------------------------
  # Qdrant — vector store usado pelo Dify para os pipelines de RAG
  # --------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-changeme-qdrant-key}
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - dify-local-gpu-net
