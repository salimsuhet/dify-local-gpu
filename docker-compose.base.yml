# ============================================================================
# docker-compose.base.yml
# ----------------------------------------------------------------------------
# Define as duas instâncias Ollama (uma por GPU) SEM a configuração de GPU,
# que muda entre Linux e Windows e é adicionada por um overlay:
#   - compose/gpu.linux.yml    (device_ids: isolamento garantido pelo Docker)
#   - compose/gpu.windows.yml  (CUDA_VISIBLE_DEVICES: isolamento pelo CUDA)
#
# O banco vetorial do RAG NÃO fica aqui: usamos o pgvector que o próprio
# Dify sobe (VECTOR_STORE=pgvector), configurado pelo bootstrap.
#
# Não rode este arquivo isolado — use scripts/up.sh ou scripts/up.ps1, que
# combinam este arquivo com o overlay correto conforme HOST_OS no .env.
# ============================================================================

networks:
  dify-local-gpu-net:
    name: ${SHARED_NETWORK_NAME:-dify-local-gpu-net}
    driver: bridge

volumes:
  ollama-gpu0-data:
  ollama-gpu1-data:

services:

  # --------------------------------------------------------------------
  # Ollama "GPU0" — modelo de CÓDIGO (assistente principal)
  # --------------------------------------------------------------------
  ollama-gpu0:
    image: ollama/ollama:latest
    container_name: ollama-gpu0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_GPU0_PORT:-11434}:11434"
    environment:
      - OLLAMA_NUM_PARALLEL=${OLLAMA_GPU0_NUM_PARALLEL:-1}
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_GPU0_NUM_CTX:-8192}
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
      # Flash attention + KV cache em 8 bits: ~metade da VRAM do contexto
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q8_0
      # Margem de VRAM que o llama.cpp deixa livre ao decidir quantas camadas
      # cabem na GPU. O padrão (1024 MiB) joga ~3 camadas de um 7B para a CPU
      # numa placa de 6 GB; 256 MiB basta numa GPU dedicada.
      - LLAMA_ARG_FIT_TARGET=${OLLAMA_VRAM_MARGIN_MIB:-256}
    volumes:
      - ollama-gpu0-data:/root/.ollama
    networks:
      - dify-local-gpu-net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3

  # --------------------------------------------------------------------
  # Ollama "GPU1" — modelo de CONVERSA (apoio) + EMBEDDING (RAG)
  # --------------------------------------------------------------------
  ollama-gpu1:
    image: ollama/ollama:latest
    container_name: ollama-gpu1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_GPU1_PORT:-11435}:11434"
    environment:
      - OLLAMA_NUM_PARALLEL=${OLLAMA_GPU1_NUM_PARALLEL:-1}
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_GPU1_NUM_CTX:-4096}
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
      # Flash attention + KV cache em 8 bits: ~metade da VRAM do contexto
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q8_0
      # Margem de VRAM que o llama.cpp deixa livre ao decidir quantas camadas
      # cabem na GPU. O padrão (1024 MiB) joga ~3 camadas de um 7B para a CPU
      # numa placa de 6 GB; 256 MiB basta numa GPU dedicada.
      - LLAMA_ARG_FIT_TARGET=${OLLAMA_VRAM_MARGIN_MIB:-256}
    volumes:
      - ollama-gpu1-data:/root/.ollama
    networks:
      - dify-local-gpu-net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
